<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电子衣橱 - Digital Wardrobe</title>

<!-- PWA -->
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#b8956a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="衣橱">
<link rel="apple-touch-icon" href="/static/icon.svg">

<style>
/* ============================================================
   全局 & 变量
   ============================================================ */
:root {
  --bg:       #faf8f5;
  --surface:  #ffffff;
  --border:   #e8e0d5;
  --text:     #3d3226;
  --text-muted: #8c7b6b;
  --accent:   #b8956a;
  --accent-2: #c9a87c;
  --danger:   #d4735e;
  --success:  #6b9e7a;
  --shadow:   0 2px 12px rgba(60,40,20,0.08);
  --radius:   12px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
}

/* ============================================================
   顶部导航
   ============================================================ */
.topbar {
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 24px; background:var(--surface); border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:100; gap:12px;
}
.topbar h1 { font-size:1.25rem; font-weight:600; color:var(--accent); white-space:nowrap; }
.topbar-actions { display:flex; gap:8px; flex-wrap:wrap; }

/* ============================================================
   按钮
   ============================================================ */
.btn {
  display:inline-flex; align-items:center; gap:6px; padding:8px 16px;
  border-radius:8px; border:1px solid var(--border); background:var(--surface);
  color:var(--text); font-size:0.875rem; cursor:pointer; transition:all .15s;
  white-space:nowrap; font-family:inherit;
}
.btn:hover { border-color:var(--accent); color:var(--accent); }
.btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
.btn.primary:hover { background:var(--accent-2); }
.btn.danger { color:var(--danger); border-color:var(--danger); }
.btn.danger:hover { background:var(--danger); color:#fff; }
.btn.small { padding:4px 10px; font-size:0.75rem; }
.btn:disabled { opacity:0.5; cursor:not-allowed; }

/* ============================================================
   主布局
   ============================================================ */
.main-layout {
  display:flex; height:calc(100vh - 60px); gap:0; overflow:hidden;
}

/* 衣柜面板 */
.wardrobe-panel {
  width:340px; min-width:280px; background:var(--surface);
  border-right:1px solid var(--border); display:flex; flex-direction:column;
  transition:width .2s;
}
.panel-header {
  padding:12px 16px; border-bottom:1px solid var(--border);
  font-weight:600; font-size:0.9rem; color:var(--text-muted);
  display:flex; align-items:center; justify-content:space-between;
}

/* 分类标签 */
.cat-tabs {
  display:flex; overflow-x:auto; gap:6px; padding:10px 12px;
  border-bottom:1px solid var(--border); scrollbar-width:none;
}
.cat-tabs::-webkit-scrollbar { display:none; }
.cat-tab {
  padding:6px 14px; border-radius:20px; border:1px solid var(--border);
  background:var(--bg); font-size:0.8rem; cursor:pointer;
  white-space:nowrap; transition:all .15s; flex-shrink:0;
}
.cat-tab:hover { border-color:var(--accent); }
.cat-tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }

/* 物品网格 */
.items-grid {
  flex:1; overflow-y:auto; padding:10px; display:grid;
  grid-template-columns:repeat(3,1fr); gap:8px; align-content:start;
}
.item-card {
  position:relative; aspect-ratio:1; border-radius:8px; overflow:hidden;
  border:2px solid transparent; cursor:pointer; background:var(--bg);
  transition:border-color .15s;
}
.item-card:hover { border-color:var(--accent); }
.item-card img {
  width:100%; height:100%; object-fit:contain; padding:4px;
}
.item-card .item-del {
  position:absolute; top:2px; right:2px; width:22px; height:22px;
  border-radius:50%; background:rgba(0,0,0,0.5); color:#fff;
  border:none; font-size:0.75rem; cursor:pointer; display:none;
  align-items:center; justify-content:center; line-height:1;
}
.item-card:hover .item-del { display:flex; }

/* 空状态 */
.empty-state {
  grid-column:1/-1; text-align:center; padding:40px 20px; color:var(--text-muted);
}
.empty-state .icon { font-size:3rem; display:block; margin-bottom:12px; }

/* ============================================================
   搭配画布区域
   ============================================================ */
.canvas-area {
  flex:1; display:flex; flex-direction:column; overflow:hidden;
}
.canvas-toolbar {
  display:flex; align-items:center; gap:8px; padding:8px 16px;
  border-bottom:1px solid var(--border); background:var(--surface);
  flex-wrap:wrap;
}
.canvas-toolbar .hint { font-size:0.78rem; color:var(--text-muted); margin-left:auto; }

.canvas-wrap {
  flex:1; overflow:auto; display:flex; align-items:center; justify-content:center;
  background: linear-gradient(45deg, #f0ece6 25%, transparent 25%),
              linear-gradient(-45deg, #f0ece6 25%, transparent 25%),
              linear-gradient(45deg, transparent 75%, #f0ece6 75%),
              linear-gradient(-45deg, transparent 75%, #f0ece6 75%);
  background-size:20px 20px;
  background-position:0 0,0 10px,10px -10px,-10px 0px;
  padding:20px;
}

/* 搭配画布 */
.outfit-canvas {
  position:relative; width:400px; height:600px; background:#fff;
  border-radius:var(--radius); box-shadow:var(--shadow);
  overflow:hidden; user-select:none; flex-shrink:0;
}
.outfit-canvas .silhouette {
  position:absolute; inset:0; pointer-events:none; opacity:0.15;
}
.outfit-canvas .silhouette svg { width:100%; height:100%; }

/* 画布上的物品 */
.canvas-item {
  position:absolute; cursor:grab; transition:box-shadow .15s;
  border:2px solid transparent; border-radius:4px;
  touch-action:none;
}
.canvas-item.selected {
  border-color:var(--accent); box-shadow:0 0 0 3px rgba(184,149,106,0.3); z-index:999 !important;
}
.canvas-item img { display:block; pointer-events:none; }
.canvas-item .ctrl-bar {
  position:absolute; top:-28px; left:50%; transform:translateX(-50%);
  display:none; gap:2px; background:var(--surface); border-radius:6px;
  box-shadow:var(--shadow); padding:2px; white-space:nowrap;
}
.canvas-item.selected .ctrl-bar { display:flex; }
.ctrl-bar button {
  width:24px; height:24px; border:none; background:none; cursor:pointer;
  border-radius:4px; font-size:0.8rem; display:flex; align-items:center;
  justify-content:center; color:var(--text);
}
.ctrl-bar button:hover { background:var(--bg); }

/* ============================================================
   模态框
   ============================================================ */
.modal-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:200;
  display:flex; align-items:center; justify-content:center;
}
.modal {
  background:var(--surface); border-radius:var(--radius); padding:24px;
  width:90%; max-width:440px; box-shadow:0 8px 40px rgba(0,0,0,0.15);
}
.modal h2 { font-size:1.1rem; margin-bottom:16px; color:var(--text); }
.modal label { display:block; font-size:0.85rem; color:var(--text-muted); margin-bottom:4px; margin-top:12px; }
.modal input, .modal select {
  width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px;
  font-size:0.9rem; font-family:inherit; background:var(--bg);
}
.modal input:focus, .modal select:focus { outline:none; border-color:var(--accent); }

.upload-zone {
  border:2px dashed var(--border); border-radius:12px; padding:40px 20px;
  text-align:center; cursor:pointer; transition:all .2s; margin-bottom:12px;
}
.upload-zone:hover, .upload-zone.drag-over { border-color:var(--accent); background:#fdfbf8; }
.upload-zone .icon { font-size:2.5rem; display:block; margin-bottom:8px; }
.upload-zone .text { font-size:0.85rem; color:var(--text-muted); }
.upload-preview { text-align:center; margin-bottom:12px; }
.upload-preview img { max-height:180px; border-radius:8px; }
.upload-progress { margin:8px 0; font-size:0.85rem; color:var(--accent); display:none; }

.modal-actions { display:flex; gap:8px; margin-top:20px; justify-content:flex-end; }

/* ============================================================
   搭配列表弹窗
   ============================================================ */
.outfit-list { max-height:300px; overflow-y:auto; }
.outfit-row {
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 12px; border-radius:8px; margin-bottom:6px;
  background:var(--bg); cursor:pointer; transition:background .15s;
}
.outfit-row:hover { background:#f0ece6; }
.outfit-row .name { font-weight:500; font-size:0.9rem; }
.outfit-row .time { font-size:0.75rem; color:var(--text-muted); }

/* Toast */
.toast {
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  padding:10px 24px; border-radius:20px; font-size:0.85rem; z-index:300;
  animation:toastIn .3s ease;
}
.toast.ok { background:var(--success); color:#fff; }
.toast.err { background:var(--danger); color:#fff; }
@keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(12px);} to{opacity:1;transform:translateX(-50%) translateY(0);} }

/* ============================================================
   响应式 - 移动端
   ============================================================ */
@media (max-width:768px) {
  .main-layout { flex-direction:column; height:auto; }
  .wardrobe-panel { width:100%; min-width:unset; max-height:40vh; border-right:none; border-bottom:1px solid var(--border); }
  .outfit-canvas { width:340px; height:500px; }
  .topbar h1 { font-size:1rem; }
  .topbar-actions .btn { font-size:0.8rem; padding:6px 12px; }
}
</style>
</head>
<body>

<!-- ====== 顶部导航 ====== -->
<header class="topbar">
  <h1>👗 电子衣橱</h1>
  <div class="topbar-actions">
    <button class="btn primary" onclick="openUploadModal()">📤 添加衣物</button>
    <button class="btn" onclick="openOutfitListModal()">📋 我的搭配</button>
    <button class="btn" onclick="saveCurrentOutfit()">💾 保存搭配</button>
    <button class="btn" onclick="clearCanvas()" style="color:var(--text-muted)">🗑 清空画布</button>
  </div>
</header>

<!-- ====== 主布局 ====== -->
<div class="main-layout">

  <!-- 左侧衣柜面板 -->
  <aside class="wardrobe-panel" id="wardrobePanel">
    <div class="panel-header">
      <span>🏠 我的衣柜</span>
      <span id="itemCount" style="font-size:0.78rem;color:var(--text-muted)">0 件</span>
    </div>
    <div class="cat-tabs" id="catTabs"></div>
    <div class="items-grid" id="itemsGrid">
      <div class="empty-state">
        <span class="icon">📦</span>
        <p>衣柜还是空的</p>
        <p style="font-size:0.8rem">点击「添加衣物」上传第一件</p>
      </div>
    </div>
  </aside>

  <!-- 右侧搭配画布 -->
  <section class="canvas-area">
    <div class="canvas-toolbar">
      <span style="font-weight:600;font-size:0.9rem;">✨ 搭配画布</span>
      <span class="hint">从衣柜点击衣物添加到画布 · 可拖拽调整位置 · 滚轮缩放</span>
    </div>
    <div class="canvas-wrap">
      <div class="outfit-canvas" id="outfitCanvas">
        <!-- 人体轮廓参考线 -->
        <div class="silhouette">
          <svg viewBox="0 0 200 500" xmlns="http://www.w3.org/2000/svg">
            <!-- 头 -->
            <ellipse cx="100" cy="48" rx="20" ry="26" fill="none" stroke="#999" stroke-width="2"/>
            <!-- 颈 -->
            <line x1="100" y1="74" x2="100" y2="88" stroke="#999" stroke-width="2"/>
            <!-- 肩 -->
            <line x1="52" y1="95" x2="148" y2="95" stroke="#999" stroke-width="2"/>
            <!-- 躯干 -->
            <path d="M54,95 L38,235 L162,235 L146,95" fill="none" stroke="#999" stroke-width="2"/>
            <!-- 手臂 -->
            <path d="M54,100 C30,160 28,210 42,220" fill="none" stroke="#999" stroke-width="2"/>
            <path d="M146,100 C170,160 172,210 158,220" fill="none" stroke="#999" stroke-width="2"/>
            <!-- 腿 -->
            <path d="M68,235 L62,430 C62,445 70,450 86,450 C98,450 100,430 100,430" fill="none" stroke="#999" stroke-width="2"/>
            <path d="M132,235 L138,430 C138,445 130,450 114,450 C102,450 100,430 100,430" fill="none" stroke="#999" stroke-width="2"/>
            <!-- 水平参考线 -->
            <line x1="20" y1="105" x2="180" y2="105" stroke="#ccc" stroke-width="0.5" stroke-dasharray="4,4"/>
            <line x1="20" y1="240" x2="180" y2="240" stroke="#ccc" stroke-width="0.5" stroke-dasharray="4,4"/>
            <line x1="20" y1="435" x2="180" y2="435" stroke="#ccc" stroke-width="0.5" stroke-dasharray="4,4"/>
          </svg>
        </div>
      </div>
    </div>
  </section>
</div>

<!-- ====== 上传模态框 ====== -->
<div class="modal-overlay" id="uploadModal" style="display:none">
  <div class="modal">
    <h2>添加新衣物</h2>
    <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
      <span class="icon">📷</span>
      <span class="text">点击或拖拽图片到此处</span>
    </div>
    <input type="file" id="fileInput" accept="image/*" style="display:none">
    <div class="upload-preview" id="uploadPreview" style="display:none">
      <img id="previewImg" src="" alt="预览">
    </div>
    <div class="upload-progress" id="uploadProgress">⏳ 正在抠图处理中，请稍候...</div>
    <label>名称（可选）</label>
    <input type="text" id="itemName" placeholder="例如：白色衬衫">
    <label>分类 *</label>
    <select id="itemCategory">
      <option value="">请选择分类</option>
      <option value="top">👔 上衣</option>
      <option value="bottom">👖 裤子</option>
      <option value="dress">👗 连衣裙</option>
      <option value="skirt">🩳 半身裙</option>
      <option value="hat">🧢 帽子</option>
      <option value="shoes">👠 鞋子</option>
      <option value="bag">👜 包包</option>
      <option value="accessory">💍 配饰</option>
    </select>
    <div class="modal-actions">
      <button class="btn" onclick="closeUploadModal()">取消</button>
      <button class="btn primary" id="uploadBtn" disabled onclick="doUpload()">上传并抠图</button>
    </div>
  </div>
</div>

<!-- ====== 搭配列表模态框 ====== -->
<div class="modal-overlay" id="outfitListModal" style="display:none">
  <div class="modal">
    <h2>已保存的搭配</h2>
    <div class="outfit-list" id="outfitList">
      <p style="color:var(--text-muted);text-align:center;padding:20px;">暂无保存的搭配</p>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeOutfitListModal()">关闭</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast" style="display:none"></div>

<script>
/* ============================================================
   全局状态
   ============================================================ */
const CAT_LABELS = {
  top:'上衣', bottom:'裤子', dress:'连衣裙', skirt:'半身裙',
  hat:'帽子', shoes:'鞋子', bag:'包包', accessory:'配饰'
};
const CAT_ICONS = {
  top:'👔', bottom:'👖', dress:'👗', skirt:'🩳',
  hat:'🧢', shoes:'👠', bag:'👜', accessory:'💍'
};

let allItems = [];               // 所有衣物
let activeCategory = 'all';      // 当前筛选分类
let canvasItems = [];            // 画布上的物品 [{item_id, filename, category, el, x, y, z, w}]
let nextZ = 10;                 // 下一个 z-index
let selectedCanvasItem = null;  // 当前选中的画布物品

/* ============================================================
   初始化
   ============================================================ */
document.addEventListener('DOMContentLoaded', () => {
  renderCatTabs();
  fetchItems();
  initUploadListeners();
  initCanvasListeners();
});

/* ============================================================
   分类标签渲染
   ============================================================ */
function renderCatTabs() {
  const container = document.getElementById('catTabs');
  const tabs = [
    {cat:'all', label:'全部', icon:'🏠'},
    ...Object.entries(CAT_LABELS).map(([k,v]) => ({cat:k, label:v, icon:CAT_ICONS[k]}))
  ];
  container.innerHTML = tabs.map(t =>
    `<span class="cat-tab${t.cat===activeCategory?' active':''}" data-cat="${t.cat}" onclick="setCategory('${t.cat}')">${t.icon} ${t.label}</span>`
  ).join('');
}

function setCategory(cat) {
  activeCategory = cat;
  renderCatTabs();
  renderItemsGrid();
}

/* ============================================================
   数据获取
   ============================================================ */
async function fetchItems() {
  try {
    const resp = await fetch('/api/items');
    if (!resp.ok) throw new Error('请求失败');
    allItems = await resp.json();
    document.getElementById('itemCount').textContent = `${allItems.length} 件`;
    renderItemsGrid();
  } catch(e) {
    toast('加载衣柜失败: ' + e.message, 'err');
  }
}

/* ============================================================
   衣柜物品网格渲染
   ============================================================ */
function renderItemsGrid() {
  const grid = document.getElementById('itemsGrid');
  const items = activeCategory === 'all'
    ? allItems
    : allItems.filter(i => i.category === activeCategory);

  if (items.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <span class="icon">${activeCategory==='all' ? '📦' : CAT_ICONS[activeCategory]||'📦'}</span>
        <p>${activeCategory==='all' ? '衣柜还是空的' : '该分类下暂无衣物'}</p>
        <p style="font-size:0.8rem">点击「添加衣物」上传第一件</p>
      </div>`;
    return;
  }

  grid.innerHTML = items.map(item => `
    <div class="item-card" title="${item.name || item.category}" onclick="addToCanvas(${item.id})" data-id="${item.id}">
      <img src="/api/image/${item.processed_filename}" alt="${item.name}" loading="lazy">
      <button class="item-del" onclick="event.stopPropagation();deleteItem(${item.id})" title="删除">×</button>
    </div>
  `).join('');
}

/* ============================================================
   删除物品
   ============================================================ */
async function deleteItem(id) {
  if (!confirm('确定删除这件衣物吗？')) return;
  try {
    await fetch(`/api/items/${id}`, {method:'DELETE'});
    removeFromCanvasByItemId(id);
    await fetchItems();
    toast('已删除');
  } catch(e) {
    toast('删除失败: ' + e.message, 'err');
  }
}

/* ============================================================
   搭配画布 - 添加物品
   ============================================================ */
function addToCanvas(itemId) {
  const item = allItems.find(i => i.id === itemId);
  if (!item) return;

  // 检查是否已在画布上
  if (canvasItems.find(ci => ci.item_id === itemId)) {
    toast('该衣物已在画布上', 'err');
    return;
  }

  const canvas = document.getElementById('outfitCanvas');
  const canvasRect = canvas.getBoundingClientRect();

  // 根据类别预设初始位置
  const defaults = {
    top:      {x:150, y:100, w:120},
    bottom:   {x:140, y:270, w:110},
    dress:    {x:130, y:95,  w:140},
    skirt:    {x:140, y:250, w:110},
    hat:      {x:165, y:8,   w:70},
    shoes:    {x:140, y:420, w:80},
    bag:      {x:255, y:180, w:70},
    accessory:{x:200, y:160, w:50},
  };
  const def = defaults[item.category] || {x:150, y:120, w:100};

  const z = nextZ++;

  const el = document.createElement('div');
  el.className = 'canvas-item';
  el.style.cssText = `left:${def.x}px;top:${def.y}px;z-index:${z};`;
  el.setAttribute('data-id', itemId);
  el.setAttribute('data-z', z);

  const img = document.createElement('img');
  img.src = `/api/image/${item.processed_filename}`;
  img.width = def.w;
  img.draggable = false;

  const ctrl = document.createElement('div');
  ctrl.className = 'ctrl-bar';
  ctrl.innerHTML = `
    <button title="上移一层" onclick="event.stopPropagation();moveLayer(${itemId},1)">↑</button>
    <button title="下移一层" onclick="event.stopPropagation();moveLayer(${itemId},-1)">↓</button>
    <button title="放大" onclick="event.stopPropagation();scaleItem(${itemId},1.15)">+</button>
    <button title="缩小" onclick="event.stopPropagation();scaleItem(${itemId},0.87)">−</button>
    <button title="删除" onclick="event.stopPropagation();removeFromCanvas(${itemId})" style="color:var(--danger)">×</button>
  `;

  el.appendChild(ctrl);
  el.appendChild(img);
  canvas.appendChild(el);

  const ci = {
    item_id: itemId,
    filename: item.processed_filename,
    category: item.category,
    el, x:def.x, y:def.y, z, w:def.w
  };
  canvasItems.push(ci);

  // 绑定拖拽
  el.addEventListener('pointerdown', (e) => onPointerDown(e, ci));

  // 点击选中
  el.addEventListener('pointerup', (e) => {
    if (!ci._dragging) selectCanvasItem(ci);
    ci._dragging = false;
  });

  selectCanvasItem(ci);
}

/* ============================================================
   画布物品选中
   ============================================================ */
function selectCanvasItem(ci) {
  if (selectedCanvasItem && selectedCanvasItem !== ci) {
    selectedCanvasItem.el.classList.remove('selected');
  }
  selectedCanvasItem = ci;
  ci.el.classList.add('selected');
}

/* ============================================================
   画布物品拖拽
   ============================================================ */
function onPointerDown(e, ci) {
  e.preventDefault();
  ci.el.setPointerCapture(e.pointerId);
  selectCanvasItem(ci);

  const rect = ci.el.getBoundingClientRect();
  ci._dragOffsetX = e.clientX - rect.left;
  ci._dragOffsetY = e.clientY - rect.top;
  ci._dragging = false;

  const onMove = (ev) => {
    const parentRect = ci.el.parentElement.getBoundingClientRect();
    let nx = ev.clientX - parentRect.left - ci._dragOffsetX;
    let ny = ev.clientY - parentRect.top - ci._dragOffsetY;
    nx = Math.max(0, Math.min(nx, parentRect.width - 30));
    ny = Math.max(0, Math.min(ny, parentRect.height - 30));
    ci.x = nx; ci.y = ny;
    ci.el.style.left = nx + 'px';
    ci.el.style.top = ny + 'px';
    if (Math.abs(ev.clientX - (rect.left + ci._dragOffsetX)) > 3 ||
        Math.abs(ev.clientY - (rect.top + ci._dragOffsetY)) > 3) {
      ci._dragging = true;
    }
  };

  const onUp = () => {
    ci.el.removeEventListener('pointermove', onMove);
    ci.el.removeEventListener('pointerup', onUp);
  };

  ci.el.addEventListener('pointermove', onMove);
  ci.el.addEventListener('pointerup', onUp);
}

/* ============================================================
   画布物品缩放（滚轮）
   ============================================================ */
function initCanvasListeners() {
  const canvas = document.getElementById('outfitCanvas');
  canvas.addEventListener('wheel', (e) => {
    if (!selectedCanvasItem) return;
    e.preventDefault();
    const delta = e.deltaY > 0 ? 0.9 : 1.1;
    scaleItemObj(selectedCanvasItem, delta);
  }, {passive:false});

  // 点击空白区域取消选中
  canvas.addEventListener('pointerdown', (e) => {
    if (e.target === canvas || e.target.classList.contains('silhouette') || e.target.tagName === 'svg' || e.target.tagName === 'path' || e.target.tagName === 'ellipse' || e.target.tagName === 'line') {
      if (selectedCanvasItem) {
        selectedCanvasItem.el.classList.remove('selected');
        selectedCanvasItem = null;
      }
    }
  });
}

function scaleItem(itemId, factor) {
  const ci = canvasItems.find(c => c.item_id === itemId);
  if (ci) scaleItemObj(ci, factor);
}

function scaleItemObj(ci, factor) {
  const img = ci.el.querySelector('img');
  const nw = Math.max(30, Math.min(300, Math.round(img.width * factor)));
  ci.w = nw;
  img.width = nw;
}

/* ============================================================
   画布物品层级调整
   ============================================================ */
function moveLayer(itemId, delta) {
  const ci = canvasItems.find(c => c.item_id === itemId);
  if (!ci) return;
  ci.z += delta;
  ci.el.style.zIndex = ci.z;
  ci.el.setAttribute('data-z', ci.z);
}

/* ============================================================
   从画布移除物品
   ============================================================ */
function removeFromCanvas(itemId) {
  const idx = canvasItems.findIndex(c => c.item_id === itemId);
  if (idx === -1) return;
  const ci = canvasItems[idx];
  if (selectedCanvasItem === ci) selectedCanvasItem = null;
  ci.el.remove();
  canvasItems.splice(idx, 1);
}

function removeFromCanvasByItemId(itemId) {
  removeFromCanvas(itemId);
}

function clearCanvas() {
  if (canvasItems.length === 0) return;
  if (!confirm('确定清空画布上的所有物品吗？此操作不可撤销。')) return;
  while (canvasItems.length > 0) {
    const ci = canvasItems.pop();
    ci.el.remove();
  }
  selectedCanvasItem = null;
}

/* ============================================================
   保存搭配
   ============================================================ */
function saveCurrentOutfit() {
  if (canvasItems.length === 0) {
    toast('画布上还没有物品，请先添加', 'err');
    return;
  }
  const name = prompt('请输入搭配名称：', '我的搭配 ' + new Date().toLocaleDateString());
  if (!name || !name.trim()) return;
  saveOutfit(name.trim());
}

async function saveOutfit(name) {
  const data = canvasItems.map(ci => ({
    item_id: ci.item_id,
    filename: ci.filename,
    category: ci.category,
    x: Math.round(ci.x),
    y: Math.round(ci.y),
    z: ci.z,
    w: ci.w
  }));

  try {
    const resp = await fetch('/api/outfits', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name, items_data:data})
    });
    if (!resp.ok) { const e = await resp.json(); throw new Error(e.error); }
    toast(`搭配「${name}」已保存`);
  } catch(e) {
    toast('保存失败: ' + e.message, 'err');
  }
}

/* ============================================================
   搭配列表弹窗 & 加载
   ============================================================ */
async function openOutfitListModal() {
  document.getElementById('outfitListModal').style.display = 'flex';
  const list = document.getElementById('outfitList');
  list.innerHTML = '<p style="text-align:center;color:var(--text-muted)">加载中...</p>';

  try {
    const resp = await fetch('/api/outfits');
    const outfits = await resp.json();
    if (outfits.length === 0) {
      list.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:20px;">暂无保存的搭配</p>';
      return;
    }
    list.innerHTML = outfits.map(o => `
      <div class="outfit-row">
        <div>
          <div class="name">${escHtml(o.name)}</div>
          <div class="time">${o.created_at?.slice(0,10) || ''} · ${o.items_data.length} 件</div>
        </div>
        <div style="display:flex;gap:4px">
          <button class="btn small" onclick="loadOutfit(${o.id})">加载</button>
          <button class="btn small danger" onclick="deleteOutfit(${o.id})">删除</button>
        </div>
      </div>
    `).join('');
  } catch(e) {
    list.innerHTML = `<p style="color:var(--danger)">加载失败: ${e.message}</p>`;
  }
}

function closeOutfitListModal() {
  document.getElementById('outfitListModal').style.display = 'none';
}

async function loadOutfit(id) {
  try {
    const resp = await fetch('/api/outfits');
    const outfits = await resp.json();
    const outfit = outfits.find(o => o.id === id);
    if (!outfit) { toast('搭配不存在', 'err'); return; }

    clearCanvas();
    outfit.items_data.forEach(d => {
      const item = allItems.find(i => i.id === d.item_id);
      if (item) {
        addToCanvasWithPos(d);
      }
    });
    closeOutfitListModal();
    toast(`已加载搭配「${outfit.name}」`);
  } catch(e) {
    toast('加载失败: ' + e.message, 'err');
  }
}

function addToCanvasWithPos(d) {
  const item = allItems.find(i => i.id === d.item_id);
  if (!item || canvasItems.find(ci => ci.item_id === d.item_id)) return;

  const canvas = document.getElementById('outfitCanvas');
  const z = d.z || nextZ++;
  if (z >= nextZ) nextZ = z + 1;

  const el = document.createElement('div');
  el.className = 'canvas-item';
  el.style.cssText = `left:${d.x}px;top:${d.y}px;z-index:${z};`;
  el.setAttribute('data-id', d.item_id);
  el.setAttribute('data-z', z);

  const img = document.createElement('img');
  img.src = `/api/image/${d.filename || item.processed_filename}`;
  img.width = d.w || 100;
  img.draggable = false;

  const ctrl = document.createElement('div');
  ctrl.className = 'ctrl-bar';
  ctrl.innerHTML = `
    <button title="上移一层" onclick="event.stopPropagation();moveLayer(${d.item_id},1)">↑</button>
    <button title="下移一层" onclick="event.stopPropagation();moveLayer(${d.item_id},-1)">↓</button>
    <button title="放大" onclick="event.stopPropagation();scaleItem(${d.item_id},1.15)">+</button>
    <button title="缩小" onclick="event.stopPropagation();scaleItem(${d.item_id},0.87)">−</button>
    <button title="删除" onclick="event.stopPropagation();removeFromCanvas(${d.item_id})" style="color:var(--danger)">×</button>
  `;

  el.appendChild(ctrl);
  el.appendChild(img);
  canvas.appendChild(el);

  const ci = {item_id:d.item_id, filename:d.filename||item.processed_filename, category:d.category, el, x:d.x, y:d.y, z, w:d.w||100};
  canvasItems.push(ci);

  el.addEventListener('pointerdown', (e) => onPointerDown(e, ci));
  el.addEventListener('pointerup', (e) => {
    if (!ci._dragging) selectCanvasItem(ci);
    ci._dragging = false;
  });
}

async function deleteOutfit(id) {
  if (!confirm('确定删除这个搭配方案吗？')) return;
  try {
    await fetch(`/api/outfits/${id}`, {method:'DELETE'});
    toast('搭配已删除');
    openOutfitListModal();
  } catch(e) {
    toast('删除失败: ' + e.message, 'err');
  }
}

/* ============================================================
   上传模态框
   ============================================================ */
function openUploadModal() {
  document.getElementById('uploadModal').style.display = 'flex';
  document.getElementById('fileInput').value = '';
  document.getElementById('uploadPreview').style.display = 'none';
  document.getElementById('uploadProgress').style.display = 'none';
  document.getElementById('itemName').value = '';
  document.getElementById('itemCategory').value = '';
  document.getElementById('uploadBtn').disabled = true;
}

function closeUploadModal() {
  document.getElementById('uploadModal').style.display = 'none';
}

let selectedFile = null;

function initUploadListeners() {
  const zone = document.getElementById('uploadZone');
  const input = document.getElementById('fileInput');
  const catSel = document.getElementById('itemCategory');
  const btn = document.getElementById('uploadBtn');

  input.addEventListener('change', () => {
    if (input.files.length > 0) {
      handleFileSelect(input.files[0]);
    }
  });

  zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
  zone.addEventListener('drop', (e) => {
    e.preventDefault();
    zone.classList.remove('drag-over');
    if (e.dataTransfer.files.length > 0) handleFileSelect(e.dataTransfer.files[0]);
  });

  catSel.addEventListener('change', () => {
    btn.disabled = !selectedFile || !catSel.value;
  });
}

function handleFileSelect(file) {
  selectedFile = file;
  const preview = document.getElementById('uploadPreview');
  const img = document.getElementById('previewImg');
  const btn = document.getElementById('uploadBtn');

  const reader = new FileReader();
  reader.onload = (e) => {
    img.src = e.target.result;
    preview.style.display = 'block';
  };
  reader.readAsDataURL(file);

  document.getElementById('itemName').value = file.name.replace(/\.[^/.]+$/, '');
  btn.disabled = !document.getElementById('itemCategory').value;
}

async function doUpload() {
  if (!selectedFile) return;
  const category = document.getElementById('itemCategory').value;
  const name = document.getElementById('itemName').value.trim();

  if (!category) { toast('请选择分类', 'err'); return; }

  const formData = new FormData();
  formData.append('image', selectedFile);
  formData.append('category', category);
  if (name) formData.append('name', name);

  document.getElementById('uploadProgress').style.display = 'block';
  document.getElementById('uploadBtn').disabled = true;

  try {
    const resp = await fetch('/api/upload', {method:'POST', body:formData});
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || '上传失败');

    document.getElementById('uploadProgress').style.display = 'none';
    closeUploadModal();
    await fetchItems();
    toast('衣物已添加并完成抠图！');
  } catch(e) {
    document.getElementById('uploadProgress').style.display = 'none';
    document.getElementById('uploadBtn').disabled = false;
    toast('上传失败: ' + e.message, 'err');
  }
}

/* ============================================================
   Toast 通知
   ============================================================ */
function toast(msg, type='ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + (type==='err'?'err':'ok');
  el.style.display = 'block';
  clearTimeout(el._timer);
  el._timer = setTimeout(() => { el.style.display = 'none'; }, 2500);
}

/* ============================================================
   工具函数
   ============================================================ */
function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// 点击模态框遮罩层关闭
document.addEventListener('click', (e) => {
  if (e.target.classList.contains('modal-overlay')) {
    e.target.style.display = 'none';
  }
});
